rotations convention: [psi, theta', phi'']

environmental constants:
    g: {value: 9.81, unit: m/s^2}
    rho: {value: 1025, unit: kg/m^3}
    nu: {value: 1.18e-6, unit: m^2/s}

environment models:

  - model: no wind

  - model: waves
    # omega max 4 rad/s: shortest wavelength ~3.9 m (lambda = 2*pi*g/omega^2), close to
    # the 4.9 m pontoons. Shorter components carry almost no energy at Hs 0.5 m.
    discretization:
      ndir: 8
      nfreq: 16
      omega min: { value: 0.1, unit: rad/s }
      omega max: { value: 4, unit: rad/s }
      energy fraction: 0.99
      equal energy bins: false
    spectra:
      - model: airy
        depth: { value: 1000, unit: m }
        seed of the random data generator: 2
        stretching:
          delta: 1
          h: { unit: m, value: 0 }
        directional spreading:
          type: cos2s
          s: 2
          waves propagating to: { value: 0, unit: deg }
        spectral density:
          type: jonswap
          Hs: { value: 0.5, unit: m }
          Tp: { value: 3, unit: s }
          gamma: 1.2
  - model: ekman current
    #seabed depth: 123
    seabed file: seabed/seabed.png
    latitude: { value: 43, unit: deg }
    top layer thickness: { value: 5, unit: m}
    bottom layer thickness: { value: 8, unit: m}
    current velocity: { value: 0.1, unit: m/s }
    current orientation: { value: 0, unit: deg }
    U10: { value: 1, unit: m/s }
    wind orientation: { value: 0, unit: rad }

# Fixed frame: NED
bodies: # All bodies have NED as parent frame

  - name: WAMV

    # WAM-V 16 at full scale, from the VRX simulator's model (github.com/osrf/vrx,
    # vrx_urdf: wamv_base.urdf.xacro, wamv_gazebo_dynamics_plugin.xacro and the
    # thruster layouts). The visual mesh WAM-V-Base.dae has the same size: 5.0 m long,
    # 2.49 m wide, keel at its origin.
    #
    # wamv_pontoons.stl: the two pontoons only, as VRX's buoyancy model has them --
    # cylinders of radius 0.213 m and length 4.9 m, axes 1.03 m either side of the
    # centreline, cut every 0.35 m along their length: xdyn evaluates the waves at
    # the mesh vertices, so facets spanning the whole pontoon would average the
    # waves out. 16-sided sections of the cylinder's area (960 facets): against the
    # former 32 sides every 0.2 m (3200 facets), heave, roll and pitch std at
    # Beaufort 3 and 10 agree within 1.5 %, for 2.6 times less computation. The deck and its frame stay out of the water and add no buoyancy.
    # The mesh is written in this body frame (x forward, y starboard, z down), with
    # the origin on the keel line like the visual mesh, so the rendered hull and the
    # xdyn hull coincide.
    mesh: wamv/meshes/wamv_pontoons.stl

    position of body frame relative to mesh:
        frame: mesh
        x: {value: 0, unit: m}
        y: {value: 0, unit: m}
        z: {value: 0, unit: m}
        phi: {value: 0, unit: rad}
        theta: {value: 0, unit: rad}
        psi: {value: 0, unit: rad}

    # Only used by the standalone xdyn CLI: a scenario sets x/y/z/yaw from its JSON
    # "spawn" block. z = 0.08 m is the equilibrium draft for 180 kg.
    initial position of body frame relative to NED:
        frame: NED
        x: {value: 0.0, unit: m}
        y: {value: 0.0, unit: m}
        z: {value: 0.08, unit: m}
        phi: {value: 0, unit: rad}
        theta: {value: 0, unit: rad}
        psi: {value: 0, unit: rad}

    initial velocity of body frame relative to NED:
        frame: WAMV
        u: {value: 0, unit: m/s}
        v: {value: 0, unit: m/s}
        w: {value: 0, unit: m/s}
        p: {value: 0, unit: rad/s}
        q: {value: 0, unit: rad/s}
        r: {value: 0, unit: rad/s}

    dynamics:

        # VRX puts the centre of gravity at the base_link origin, which is this body
        # frame's origin. Damping is applied at the same point.
        hydrodynamic forces calculation point in body frame:
            x: {value: 0, unit: m}
            y: {value: 0, unit: m}
            z: {value: 0, unit: m}

        centre of inertia:
            frame: WAMV
            x: {value: 0, unit: m}
            y: {value: 0, unit: m}
            z: {value: 0, unit: m}

        # VRX base_link: 180 kg, Ixx 120, Iyy 393, Izz 446 kg.m^2 ("From WAM-V spec
        # sheet" in wamv_base.urdf.xacro).
        rigid body inertia matrix at the center of gravity and projected in the body frame:
            row 1: [ 180,   0,   0,   0,   0,   0]
            row 2: [   0, 180,   0,   0,   0,   0]
            row 3: [   0,   0, 180,   0,   0,   0]
            row 4: [   0,   0,   0, 120,   0,   0]
            row 5: [   0,   0,   0,   0, 393,   0]
            row 6: [   0,   0,   0,   0,   0, 446]

        # VRX sets every added-mass term to zero (xDotU = yDotV = nDotR = 0).
        added mass matrix at the center of gravity and projected in the body frame:
            row 1: [ 0, 0, 0, 0, 0, 0]
            row 2: [ 0, 0, 0, 0, 0, 0]
            row 3: [ 0, 0, 0, 0, 0, 0]
            row 4: [ 0, 0, 0, 0, 0, 0]
            row 5: [ 0, 0, 0, 0, 0, 0]
            row 6: [ 0, 0, 0, 0, 0, 0]

    external forces:
        - model: gravity

        - model: non-linear hydrostatic (exact)

        # The hydrostatic model only integrates rho*g*z (z from the mean sea level)
        # over the hull below the wave surface; the incident wave pressure comes
        # from Froude-Krylov. Without it the hull barely follows the waves (heave
        # about 0.3 of the wave amplitude even in 60 m waves); with it, heave is
        # 0.99 of the amplitude in 60 m waves, 0.84 in 15 m and 0.56 in 8 m waves.
        - model: non-linear Froude-Krylov

        # VRX SimpleHydrodynamics: xU 100, yV 100, zW 500, kP 300, mQ 900, nR 800.
        - model: linear damping
          damping matrix at the center of gravity projected in the body frame:
            frame: WAMV
            row 1: [100,   0,   0,   0,   0,   0]
            row 2: [  0, 100,   0,   0,   0,   0]
            row 3: [  0,   0, 500,   0,   0,   0]
            row 4: [  0,   0,   0, 300,   0,   0]
            row 5: [  0,   0,   0,   0, 900,   0]
            row 6: [  0,   0,   0,   0,   0, 800]

        # VRX SimpleHydrodynamics: xUU 150, yVV 100, kPP 600, mQQ 900, nRR 800 (no zWW).
        - model: quadratic damping
          damping matrix at the center of gravity projected in the body frame:
            frame: WAMV
            row 1: [150,   0,   0,   0,   0,   0]
            row 2: [  0, 100,   0,   0,   0,   0]
            row 3: [  0,   0,   0,   0,   0,   0]
            row 4: [  0,   0,   0, 600,   0,   0]
            row 5: [  0,   0,   0,   0, 900,   0]
            row 6: [  0,   0,   0,   0,   0, 800]

        # Twin stern engines, at VRX's propeller positions: engine mounts at
        # (-2.374, +/-1.027, 0.318) m from base_link, propeller 0.509 m below the
        # mount, so 0.191 m below the keel line. Commanded as a thrust "T" in newtons
        # along +X, like BlueROV2_current_*.yml. Differential thrust gives the yaw
        # moment N = 1.027 * (T_left - T_right); there is no sway actuator.
        - model: maneuvering
          name: wamv_prop_left
          reference frame:
              frame: WAMV
              x: {value: -2.374, unit: m}
              y: {value: -1.027, unit: m}
              z: {value: 0.191, unit: m}
              phi: {value: 0, unit: deg}
              theta: {value: 0, unit: deg}
              psi: {value: 0, unit: deg}
          commands: [T]
          X: T
          Y: 0
          Z: 0
          K: 0
          M: 0
          N: 0
        - model: maneuvering
          name: wamv_prop_right
          reference frame:
              frame: WAMV
              x: {value: -2.374, unit: m}
              y: {value: 1.027, unit: m}
              z: {value: 0.191, unit: m}
              phi: {value: 0, unit: deg}
              theta: {value: 0, unit: deg}
              psi: {value: 0, unit: deg}
          commands: [T]
          X: T
          Y: 0
          Z: 0
          K: 0
          M: 0
          N: 0
