rotations convention: [psi, theta', phi'']

environmental constants:
  g: { value: 9.81, unit: m/s^2 } # TODO: Input from general config file
  rho: { value: 1026, unit: kg/m^3 } # TODO: Input from general config file
  nu: { value: 1.18e-6, unit: m^2/s } # TODO: Input from general config file

environment models:
  - model: waves
    discretization:
      ndir: 8
      nfreq: 16
      omega min: { value: 0.5, unit: rad/s }
      omega max: { value: 5, unit: rad/s }
      energy fraction: 0.99
    spectra:
      - model: airy
        depth: { value: 100, unit: m }
        seed of the random data generator: 2
        stretching:
          delta: 1
          h: { unit: m, value: 0 }
        directional spreading:
          type: cos2s
          s: 2
          waves propagating to: { value: 0, unit: deg }
        spectral density:
          type: jonswap
          Hs: { value: 5, unit: m }
          Tp: { value: 8, unit: s }
          gamma: 1.2
  - model: ekman current
    #seabed depth: 123
    seabed file: seabed/seabed.png
    latitude: { value: 43, unit: deg }
    top layer thickness: { value: 5, unit: m}
    bottom layer thickness: { value: 8, unit: m}
    current velocity: { value: 0.1, unit: m/s }
    current orientation: { value: 0, unit: deg }
    U10: { value: 1, unit: m/s }
    wind orientation: { value: 0, unit: rad }

bodies:
  - name: LRAUV
    # tethys.stl (the detailed visual/CAD mesh, still used for Gazebo
    # rendering via model.sdf, untouched) is 39 disconnected sub-parts
    # (hull + fins + antenna + nose details, ...), not one closed hull --
    # not watertight even after isolating just the largest piece
    # (euler number -5, i.e. real topological holes), and xdyn's own
    # "facets seem oriented inwards" load warning was not cosmetic: gravity
    # + hydrostatic on this mesh produced a real, huge, wrong force (surge
    # 0.2 -> ~21 m/s in 2s, standalone-CLI tested with no propeller
    # command at all). tethys_hydrostatic_hull.stl is a plain capsule
    # (cylinder + hemispherical caps), watertight, single closed shell,
    # every normal outward, same length as tethys.stl's own largest
    # connected component (2.245 m, matches Tethys's real ~2.1-2.3 m hull).
    # Radius shrunk from that component's actual 0.1524 m (12 in, its real
    # hull diameter) to 0.1341 m so the capsule's own displaced volume
    # (0.121 m^3) makes this body neutrally buoyant at its rigid-body mass
    # (125 kg / 1026 kg/m^3 = 0.122 m^3) -- real AUVs trim close to neutral
    # by design (internal components aren't all part of the displacement),
    # and without that a gravity/buoyancy mismatch with no counteracting
    # force just bobs the vehicle across tens of metres of depth forever
    # (tested: the full-radius capsule did exactly this). Centered exactly
    # at (0,0,0) in the mesh/body frame -- matching "centre of inertia"
    # below -- not at tethys.stl's own off-center bounding-box centroid
    # (x=0.29 m): a center-of-buoyancy/center-of-gravity offset that size
    # created a ~350 N.m destabilizing pitch moment with nothing to
    # counter it (tested: phi and theta both grew without bound instead of
    # settling). Built with trimesh; regenerate via
    # `trimesh.creation.capsule(radius=0.1341, height=1.9768)` rotated
    # 90 deg about Y, no translation needed (capsule() is origin-centered)
    # -- if this
    # ever needs re-deriving. Used for hydrostatic/Froude-Krylov purposes
    # only -- not a substitute for a properly repaired/capped tethys.stl,
    # which would let the appendages (fins, antenna) contribute their own
    # (much smaller) buoyancy too.
    mesh: lrauv/tethys_hydrostatic_hull.stl

    position of body frame relative to mesh:
      frame: mesh(LRAUV)
      x: { value: 0, unit: m }
      y: { value: 0, unit: m }
      z: { value: 0, unit: m }
      phi: { value: 0, unit: rad }
      theta: { value: 0, unit: rad }
      psi: { value: 0, unit: rad }

    initial position of body frame relative to NED:
      frame: NED
      x: { value: 0, unit: m }
      y: { value: 0, unit: m }
      z: { value: 50, unit: m }
      phi: { value: 0, unit: rad }
      theta: { value: 0, unit: rad }
      psi: { value: 0, unit: rad }

    initial velocity of body frame relative to NED:
      frame: LRAUV
      u: { value: 0.2, unit: m/s }
      v: { value: 0, unit: m/s }
      w: { value: 0, unit: m/s }
      p: { value: 0, unit: rad/s }
      q: { value: 0, unit: rad/s }
      r: { value: 0, unit: rad/s }

    dynamics:
      hydrodynamic forces calculation point in body frame:
        x: { value: 0, unit: m }
        y: { value: 0, unit: m }
        z: { value: 0, unit: m }

      centre of inertia:
        frame: mesh(LRAUV)
        x: { value: 0, unit: m }
        y: { value: 0, unit: m }
        z:
          { value: 0, unit: m }

          # This is taken from the LRAUV github
      ? rigid body inertia matrix at the center of gravity and projected in the body frame
      : row 1: [125, 0, 0, 0, 0, 0]
        row 2: [0, 125, 0, 0, 0, 0]
        row 3: [0, 0, 125, 0, 0, 0]
        row 4: [0, 0, 0, 10000, 0, 0] # to keep the trajectory straight
        row 5: [0, 0, 0, 0, 5000000, 0] # to keep the trajectory straight
        row 6: [0, 0, 0, 0, 0, 5000000] # to keep the trajectory straight

      ? added mass matrix at the center of gravity and projected in the body frame
      : row 1: [4.876161, 0, 0, 0, 0, 0]
        row 2: [0, 126.324739, 0, 0, 0, 0]
        row 3: [0, 0, 126.324739, 0, 0, 0]
        row 4: [0, 0, 0, 0, 0, 0]
        row 5: [0, 0, 0, 0, 33.46, 0]
        row 6: [0, 0, 0, 0, 0, 33.46]

    # "external forces" must be a direct child of the body's top-level
    # node, not nested under "dynamics:" -- the parser
    # (yaml_parser/external_data_structures_parsers.cpp's `operator>>` for
    # YamlBody) only reads it from that location and silently defaults to
    # an empty list otherwise (`try_to_parse` is a no-op on a missing key,
    # no error). With zero force models, every rate (u,v,w,p,q,r) stays
    # frozen at its initial value regardless of the propeller curve below.
    # Gravity/hydrostatic stay active here (unlike the drift-only
    # variants) since depth-holding needs buoyancy, not just current drag.
    external forces:
      - model: gravity
      - model: non-linear hydrostatic (fast) # Looks like this is the best choice with precison and speed
      #- model: non-linear hydrostatic (exact) # If precision prevails
      #- model: non-linear hydrostatic (fast) # If computation speed prevails

      # Froude-Krylov integrates the real wave field's pressure over the
      # wetted hull. With "environment models: - model: waves" declaring
      # a genuine Hs=5m sea state and this vehicle at only 10m depth
      # (within wave-influenced depth for that Hs), it injects sizeable
      # oscillating forces on u/v/w independent of the vehicle's own
      # speed. Nothing restores horizontal position (only damping resists
      # velocity change), so with a fixed low-rpm propeller command and no
      # navigation feedback in the loop, that oscillation is enough to
      # push the propeller's J = (1-w)*|u-current|/(n*D) past its table's
      # domain regardless of controller behavior. Do not re-enable without
      # either a validated wave-response model for this vehicle or a
      # current-feedback-aware controller design.
      #- model: non-linear Froude-Krylov

      # With gravity+hydrostatic active but no viscous damping at all
      # (diffraction/radiation-damping disabled below, missing hdb), any
      # buoyancy/weight mismatch has nothing to dissipate it and the
      # vehicle bobs in heave indefinitely. tau = mass/damping ~= 15-17s
      # on surge/sway/heave, same convention as fremmConfig.yaml's own
      # damping; rotational rows left at 0 since hydrostatic's own
      # restoring moment already keeps phi/theta bounded.
      - model: linear damping
        damping matrix at the center of gravity projected in the body frame:
          frame: LRAUV
          row 1: [9, 0, 0, 0, 0, 0]
          row 2: [0, 15, 0, 0, 0, 0]
          row 3: [0, 0, 15, 0, 0, 0]
          row 4: [0, 0, 0, 0, 0, 0]
          row 5: [0, 0, 0, 0, 0, 0]
          row 6: [0, 0, 0, 0, 0, 0]

      # Both reference hdb: LRAUV.hdb, which does not exist on disk --
      # hard failure at load (HDBParser::from_file) now that this block is
      # actually being parsed. Needs a real hdb before either can be
      # re-enabled.
      #- model: diffraction
      #  hdb: LRAUV.hdb
      #  calculation point in body frame:
      #    x: { value: 0, unit: m } # Check at what point was the RAO in the HDB file computed
      #    y: { value: 0, unit: m } # Check at what point was the RAO in the HDB file computed
      #    z: { value: 0, unit: m } # Check at what point was the RAO in the HDB file computed
      #  mirror for 180 to 360: false # Check your HDB file to see if this is necessary

      # Not a valid xdyn force model ("Simulator does not know model
      # 'airy'") -- a copy/paste of the wave-spectrum config that's already
      # correctly declared under "environment models: - model: waves >
      # spectra:" at the top of this file.
      #- model: airy
      #  depth: { value: 500, unit: m } # TODO: Input from general config file = SurfaceHeight
      #  seed of the random data generator: 121
      #  stretching: # Stretching model is fixed to Wheeler's -- do not change delta, set h to depth
      #    delta: 0
      #    h: { unit: m, value: 500 } # TODO: Input from general config file = SurfaceHeight
      #  directional spreading:
      #    type: cos2s
      #    s: 2 # Higher value will decrease the spreading
      #    waves propagating to: { value: 0, unit: deg }
      #  spectral density: # Moderate Sea State values
      #    type: jonswap
      #    Hs: { value: 1.8750, unit: m } # TODO: Input from setupMetocean script from user input
      #    Tp: { value: 7.2573, unit: s } # TODO: Input from setupMetocean script from user input
      #    gamma: 2.65 # TODO: Input from setupMetocean script from user input

      #- model: radiation damping
      #  hdb: LRAUV.hdb
      #  type of quadrature for cos transform: gauss-kronrod # If precision prevails
      #  #type of quadrature for cos transform: simpson # If speed and precision prevail
      #  #type of quadrature for cos transform: rectangle # If speed prevails (bad precision)
      #  type of quadrature for convolution: clenshaw-curtis
      #
      #  nb of points for retardation function discretization: 100 # Higher value means better precision
      #  omega min: { value: 0, unit: rad/s } # Check with HDB file
      #  omega max: { value: 40, unit: rad/s } # Check with HDB file
      #  tau min: { value: 0.2094395, unit: s } # Check with HDB file
      #  tau max: { value: 10, unit: s } # Check with HDB file
      #  output Br and K: false # Set to true when validating your choice of algorithm and parameters by validating Radiation Damping Matrices and Retardation Functions

    controlled forces:
      # Generic Wageningen B-series (Kt/Kq computed from a parametric fit
      # over AE/A0, P/D, Z) was tried first but its own advance-ratio
      # domain-validity warning fires at every gain level -- it's a poor
      # fit for this propeller's abnormally low blade-area ratio (a
      # low-Reynolds custom lifting-surface design, not a B-series hull
      # form). Superseded below by the explicit Kt(J)/Kq(J) table, which
      # is this vehicle's own MIT-PLL-designed propeller curve (Bellingham
      # et al., "Efficient Propulsion for the Tethys Long-Range AUV", IEEE
      # AUV'2010): its Kt(J=0)=0.15 matches the paper's measured bollard
      # pull thrust (4.4 N @150 RPM, 18.2 N @300 RPM -> Kt(0) ~= 0.165-0.17,
      # same order and same D/rho scaling) far better than a mismatched
      # generic formula does.
      # - name: propeller
      #   model: wageningen B-series
      #   position of propeller frame:
      #     frame: mesh(LRAUV)
      #     x: { value: -1.43162, unit: m }
      #     y: { value: 0, unit: m }
      #     z: { value: 0, unit: m }
      #     phi: { value: 0, unit: rad }
      #     theta: { value: 0, unit: deg }
      #     psi: { value: 0, unit: deg }
      #   wake coefficient w: 0.13
      #   relative rotative efficiency etaR: 0.8
      #   thrust deduction factor t: 0.21978
      #   rotation: clockwise
      #   number of blades: 2
      #   blade area ratio AE/A0: 0.308
      #   diameter: { value: 0.2539, unit: m }

      - name: propeller
        model: Kt(J) & Kq(J)
        position of propeller frame:
          frame: mesh(LRAUV)
          x: { value: -1.43162, unit: m } # sign kept as previously active/tested; direction unverified either way
          y: { value: 0, unit: m }
          z: { value: 0, unit: m }
          phi: { value: 0, unit: rad }
          theta: { value: 0, unit: deg }
          psi: { value: 0, unit: deg }
        wake coefficient w: 0.13 # confirmed by Bellingham et al. AUV'2010 (Taylor wake fraction)
        relative rotative efficiency etaR: 0.8
        thrust deduction factor t: 0.21978
        rotation: clockwise
        diameter: { value: 0.2539, unit: m } # confirmed: 10 in propeller, Bellingham et al. AUV'2010
        J:
          [
            -0.001,
            0.0762032296179596,
            0.0862032296179596,
            0.0962032296179596,
            0.106203229617960,
