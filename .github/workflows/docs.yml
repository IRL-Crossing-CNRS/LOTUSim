name: Documentation site

# Builds docs/site and publishes it to GitHub Pages
# (https://irl-crossing-cnrs.github.io/LOTUSim/). The other repositories are
# read from their public main branches, so the nightly run also picks up
# their documentation changes.

on:
  push:
    branches: [main, sync/naval-group]
    paths: ["docs/**", "README.md", "CONTRIBUTING.md", "examples/**", "interfaces/**", ".github/workflows/docs.yml"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone the other repositories
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/repos"
          cd "$RUNNER_TEMP/repos"
          for repo in LOTUSim-generic-scenario How_To_Install_LOTUSim LOTUSim-Energy; do
            git clone --quiet --filter=blob:none --no-checkout \
              "https://github.com/IRL-Crossing-CNRS/$repo.git"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx
        run: pip install -r docs/site/requirements.txt

      - name: Build
        env:
          LOTUSIM_DOCS_SCENARIO_REPO: ${{ runner.temp }}/repos/LOTUSim-generic-scenario
          LOTUSIM_DOCS_INSTALL_REPO: ${{ runner.temp }}/repos/How_To_Install_LOTUSim
          LOTUSIM_DOCS_UNITY_REPO: ${{ runner.temp }}/repos/LOTUSim-Energy
        run: |
          cd docs/site
          python collect.py
          sphinx-build -b html -q . _build/html

      # lotusim-links.html is what the printed QR codes open: never publish
      # a site without it.
      - name: Check the QR-code page is published
        run: test -s docs/site/_build/html/lotusim-links.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
